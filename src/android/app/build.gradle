plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Resolve release signing credentials in priority order:
//   1. Local `src/android/key.properties` file (for local developer release builds).
//   2. `ANDROID_*` environment variables (injected from GitHub Secrets in `.github/workflows/release.yml`).
//   3. Automatic fallback to `signingConfigs.debug` when neither is configured or the keystore
//      file does not exist on disk, ensuring `flutter build apk/appbundle --release` works
//      out-of-the-box on local workstations and unconfigured CI forks.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def releaseStoreFile = keystoreProperties['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = keystoreProperties['storePassword'] ?: System.getenv('ANDROID_STORE_PASSWORD')
def releaseKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseKeystore = releaseStoreFile != null && !releaseStoreFile.isEmpty() && file(releaseStoreFile).exists()

android {
    // Under Android Gradle Plugin (AGP) 8+, `namespace` is the sole authority for the
    // generated R/BuildConfig package namespace (`package=` attributes are omitted from
    // `src/{main,debug,profile}/AndroidManifest.xml` to avoid manifest merger conflicts).
    namespace "moe.retro.bluepad32"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "moe.retro.bluepad32"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            // FIXME: Work-around for https://github.com/pauldemarco/flutter_blue/issues/772
            shrinkResources false
            minifyEnabled false
        }
    }
}

flutter {
    source '../..'
}
